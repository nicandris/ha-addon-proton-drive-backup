name: Proton Drive Backup
version: "0.1.2"
slug: proton_drive_backup
description: Automatically back up Home Assistant to Proton Drive using the official Proton Drive SDK.
url: https://github.com/nicandris/ha-addon-proton-drive
arch:
  - aarch64
  - amd64
  - armv7
init: false
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-lock
panel_title: Proton Backup
options:
  proton_email: ""
  proton_password: ""
  drive_folder: Home Assistant Backups
  backup_interval_hours: 24
  backups_in_proton: 10
  backups_in_ha: 4
  full_backup: true
  backup_password: ""
  log_level: info
schema:
  proton_email: str
  proton_password: password
  drive_folder: str
  backup_interval_hours: int(0,)
  backups_in_proton: int(0,)
  backups_in_ha: int(0,)
  full_backup: bool
  backup_password: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
