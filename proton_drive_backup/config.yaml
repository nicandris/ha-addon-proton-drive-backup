name: Proton Drive Backup
version: "0.5.1.2"
slug: proton_drive_backup
description: Mirror your Home Assistant backups to Proton Drive using the official Proton Drive CLI.
url: https://github.com/nicandris/ha-addon-proton-drive-backup
# Prebuilt images are published by .github/workflows/release.yml. Leave this
# commented until a release has pushed BOTH arches and the GHCR packages are
# public — with `image:` set, the Supervisor pulls instead of building, so an
# image that doesn't exist yet breaks every install and update.
# image: ghcr.io/nicandris/{arch}-proton-drive-backup
arch:
  - amd64
  - aarch64
init: false
# The Proton CLI stores its sign-in session under /data. Home Assistant full
# backups include an add-on's /data, so without this every backup — including the
# ones this add-on uploads to Proton — would carry a USABLE Proton session token.
# Excluding it means a restored backup asks you to press Connect again, which is
# the right trade for not shipping a live credential inside every archive.
# The Supervisor matches these with PurePath.match() against ITS path
# (/data/addons/data/<slug>/proton-drive-cli/...), not the container's /data, so
# they must be RELATIVE: an absolute "/data/proton-drive-cli/*" never matches.
# The bare directory name excludes the whole directory (it is not recursed into).
backup_exclude:
  - proton-drive-cli
  - proton-drive-cli/*
hassio_api: true
# `backup` is enough: it allows /backups* and every */info call (incl.
# /host/info); /addons/self/options bypasses role checks altogether
# (Supervisor api/middleware/security.py). `manager` would add far more.
hassio_role: backup
# Only to raise/clear a persistent notification when a sync fails or a sign-in
# is needed (Core API: persistent_notification.create / .dismiss).
homeassistant_api: true
ingress: true
panel_icon: mdi:cloud-lock
panel_title: Proton Backup
options:
  drive_folder: Home Assistant Backups
  backup_interval_hours: 24
  keep_automatic_in_proton: 10
  keep_app_in_proton: 10
  keep_automatic_in_ha: 0
  keep_app_in_ha: 0
  permanently_delete: false
  automatic_name_prefix: Automatic backup
  backup_password: ""
  log_level: info
schema:
  drive_folder: str
  backup_interval_hours: int(0,)
  keep_automatic_in_proton: int(0,)
  keep_app_in_proton: int(0,)
  keep_automatic_in_ha: int(0,)
  keep_app_in_ha: int(0,)
  permanently_delete: bool
  automatic_name_prefix: str
  backup_password: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
