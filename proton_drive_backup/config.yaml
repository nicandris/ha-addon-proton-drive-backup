name: Proton Drive Backup
version: "0.3.1"
slug: proton_drive_backup
description: Mirror your Home Assistant backups to Proton Drive using the official Proton Drive CLI.
url: https://github.com/nicandris/ha-addon-proton-drive
arch:
  - amd64
  - aarch64
init: false
hassio_api: true
hassio_role: manager
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-lock
panel_title: Proton Backup
options:
  drive_folder: Home Assistant Backups
  backup_interval_hours: 24
  backups_in_proton: 10
  backups_in_ha: 4
  backup_password: ""
  log_level: info
schema:
  drive_folder: str
  backup_interval_hours: int(0,)
  backups_in_proton: int(0,)
  backups_in_ha: int(0,)
  backup_password: password?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
